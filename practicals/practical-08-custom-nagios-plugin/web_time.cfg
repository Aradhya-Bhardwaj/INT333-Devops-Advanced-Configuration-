define command {
    command_name    check_web_time
    command_line    /usr/lib/nagios/plugins/check_web_time.sh http://$HOSTADDRESS$$ARG1$ $ARG2$ $ARG3$
}

define service {
    use                     generic-service
    host_name               dropwatch-app
    service_description     DropWatch response time
    check_command           check_web_time!/login/!1!3
}
